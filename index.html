<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Absensi Sederhana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Sistem Absensi Online</h2>
            <p class="text-muted">Silakan isi data kehadiran Anda di bawah ini</p>
            <p class="mb-0">
                <a href="https://www.google.com" target="_blank" rel="noopener">
                    Kunjungi Google
                </a>
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Formulir Kehadiran</h5>
                    </div>
                    <div class="card-body">
                        <form id="formAbsen">
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama Anda" required>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Keterangan</label>
                                <select class="form-select" id="status" required>
                                    <option value="" selected disabled>Pilih Status</option>
                                    <option value="Hadir">Hadir</option>
                                    <option value="Izin">Izin</option>
                                    <option value="Sakit">Sakit</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Kirim Absen</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Riwayat Kehadiran Hari Ini</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Nama</th>
                                        <th>Status</th>
                                        <th>Waktu</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelAbsen">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted">Belum ada data absensi.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dataAbsensi = [];

        const form = document.getElementById('formAbsen');
        const tabelAbsen = document.getElementById('tabelAbsen');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const status = document.getElementById('status').value;
            const sekarang = new Date();
            const waktu = sekarang.toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            }) + ' WIB';

            dataAbsensi.push({ nama, status, waktu });
            form.reset();
            renderTabel();
        });

        function renderTabel() {
            if (dataAbsensi.length === 0) {
                tabelAbsen.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Belum ada data absensi.</td></tr>';
                return;
            }

            let html = '';
            dataAbsensi.forEach((item, index) => {
                let badgeColor = 'bg-success';
                if (item.status === 'Izin') badgeColor = 'bg-warning text-dark';
                if (item.status === 'Sakit') badgeColor = 'bg-info text-dark';

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.nama}</td>
                        <td><span class="badge ${badgeColor}">${item.status}</span></td>
                        <td>${item.waktu}</td>
                    </tr>
                `;
            });
            tabelAbsen.innerHTML = html;
        }
    </script>
</body>
</html>
